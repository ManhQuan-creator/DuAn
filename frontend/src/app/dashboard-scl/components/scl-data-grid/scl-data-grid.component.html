<div class="ag-theme-quartz scl-grid-host">
  <app-ag-grid-wrapper [enableRangeSelection]="true"
    [rowData]="rowData"
    [columnDefs]="colDefs"
    [defaultColDef]="{ resizable: true, sortable: true, filter: true }"
    [enableZoom]="false"
    [suppressCellFocus]="true"
    [rowHeight]="38"
    [headerHeight]="44"
    [width]="'100%'"
    [height]="'520px'"
  ></app-ag-grid-wrapper>
</div>
