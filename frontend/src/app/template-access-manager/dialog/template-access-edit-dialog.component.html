<div class="dialog-wrapper">
  <div class="dialog-header">
    <h2 class="dialog-title">Sửa rule phân quyền</h2>
    <span class="dialog-subtitle">Biểu mẫu: [{{ data.templateId }}] {{ data.templateName }}</span>
  </div>

  <div class="dialog-body">
    <!-- Action Key -->
    <div class="form-card">
      <div class="field">
        <label class="field-label">Action Key <span class="req">*</span></label>
        <select class="field-input" [(ngModel)]="form.actionKey">
          <option value="">— Chọn action —</option>
          <option *ngFor="let b of buttonOptions" [value]="b.value">{{ b.label }}</option>
        </select>
      </div>
    </div>

    <!-- Phạm vi phân quyền -->
    <div class="section-title">Phạm vi phân quyền</div>
    <div class="form-card">

      <!-- Bước 1: Nhóm tổ chức -->
      <div class="perm-block">
        <div class="perm-block__title">Nhóm tổ chức</div>
        <div class="org-group-list">
          <label
            *ngFor="let opt of orgGroupOptions"
            class="org-group-item"
            [class.org-group-item--active]="form.orgGroupCode === opt.value"
          >
            <input
              type="radio"
              name="orgGroup"
              [value]="opt.value"
              [(ngModel)]="form.orgGroupCode"
              (ngModelChange)="onOrgGroupChange()"
            />
            <div class="org-group-item__content">
              <span class="org-group-item__label">{{ opt.label }}</span>
              <span class="org-group-item__hint">{{ opt.hint }}</span>
            </div>
          </label>
        </div>
      </div>

      <!-- Bước 2: Loại nhân sự (chỉ hiện khi chọn EVNNPC hoặc PC) -->
      <div *ngIf="showEmployeeKind" class="perm-block step">
        <div class="perm-block__title">Loại nhân sự</div>
        <div class="kind-list">
          <label class="kind-item" [class.kind-item--active]="form.employeeKind === 'TOP'">
            <input type="radio" name="empKind" value="TOP"
                   [(ngModel)]="form.employeeKind"
                   (ngModelChange)="onEmployeeKindChange()" />
            <div class="kind-item__content">
              <span class="kind-item__label">{{ topLevelLabel }}</span>
              <span class="kind-item__hint">HĐTV, TGĐ, P.TGĐ... (không thuộc Ban/Phòng)</span>
            </div>
          </label>
          <label class="kind-item" [class.kind-item--active]="form.employeeKind === 'DEPT'">
            <input type="radio" name="empKind" value="DEPT"
                   [(ngModel)]="form.employeeKind"
                   (ngModelChange)="onEmployeeKindChange()" />
            <div class="kind-item__content">
              <span class="kind-item__label">{{ deptLevelLabel }}</span>
              <span class="kind-item__hint">Trưởng Ban/Phòng, Chuyên viên...</span>
            </div>
          </label>
        </div>
      </div>

      <!-- Bước 3a: Chức danh lãnh đạo (TOP) -->
      <div *ngIf="isTopLevel" class="step">
        <div class="form-grid">
          <div class="field field--span-2">
            <label class="field-label">Chức danh</label>
            <select class="field-input" [(ngModel)]="form.subjectPositionCode">
              <option value="">— Tất cả chức danh lãnh đạo —</option>
              <option *ngFor="let p of visiblePositions" [value]="p.positionCode">
                {{ p.positionName }}
              </option>
            </select>
          </div>
        </div>
      </div>

      <!-- Bước 3b: Ban/Phòng + Chức danh (DEPT) -->
      <div *ngIf="isDeptLevel" class="step">
        <div class="form-grid">
          <div class="field">
            <label class="field-label">{{ deptLabel }}</label>
            <select class="field-input"
                    [(ngModel)]="form.subjectOrgCode"
                    (ngModelChange)="onDeptChange()">
              <option value="">— Tất cả {{ deptLabel }} —</option>
              <option *ngFor="let d of visibleDepts" [value]="d.deptTypeCode">
                {{ d.deptTypeName }} ({{ d.deptTypeCode }})
              </option>
            </select>
          </div>

          <div class="field" *ngIf="showPositionPicker">
            <label class="field-label">Chức danh</label>
            <select class="field-input" [(ngModel)]="form.subjectPositionCode">
              <option value="">— Tất cả chức danh —</option>
              <option *ngFor="let p of visiblePositions" [value]="p.positionCode">
                {{ p.positionName }}
              </option>
            </select>
          </div>
        </div>
      </div>

    </div>
  </div>

  <div class="dialog-footer">
    <button class="tacd-btn tacd-btn--cancel" (click)="cancel()">Hủy</button>
    <button class="tacd-btn tacd-btn--confirm"
            [disabled]="!canSubmit()"
            (click)="submit()">
      Lưu
    </button>
  </div>
</div>
